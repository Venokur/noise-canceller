name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # tauri-build checks bundle.resources on every cargo build, and the models
      # are 100 MB of runtime data that is not in git. Cache them, otherwise each
      # run downloads the same files. The key carries the hash of the fetch
      # script: a new model revision changes the script and cannot be hidden by
      # a stale cache.
      - uses: actions/cache@v4
        with:
          path: |
            app/models
            app/native
          key: models-${{ hashFiles('app/scripts/fetch-models.ps1') }}
          restore-keys: models-

      - name: Fetch models
        working-directory: app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-models.ps1

      - name: UI context check
        working-directory: app
        run: npm run check:ui

      - name: Format
        working-directory: app
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        working-directory: app
        run: cargo test --workspace

      - name: Frontend build
        working-directory: app
        run: npm run build

      - name: License inventory
        working-directory: app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\licenses.ps1 -Check

      - name: Bundle config
        working-directory: app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-bundle.ps1

      - name: Tauri build (portable exe)
        working-directory: app
        run: npm run tauri build -- --no-bundle
