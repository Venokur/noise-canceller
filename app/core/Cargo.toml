[package]
name = "noise-canceller-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal.workspace = true
rtrb.workspace = true
libloading.workspace = true
hound.workspace = true
# UL-UNAS DNS3: a small streaming denoiser in pure Rust, weights embedded
ul_unas_rs = "0.1"
# NovaSR: the optional "air" stage. `load-dynamic` reuses native/onnxruntime.dll,
# which sherpa-onnx already ships, instead of linking a second copy.
ort = { version = "=2.0.0-rc.10", features = ["load-dynamic"] }
